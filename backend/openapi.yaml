openapi: 3.0.3
info:
  title: Zalivaj API
  version: 0.1.0
  description: REST API za organizacijo varstva sobnih rastlin.
servers:
  - url: http://localhost:3000
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    PlantForm:
      type: object
      required: [name, wateringEveryDays]
      properties:
        name: { type: string, example: Bazilika }
        species: { type: string, example: Ocimum basilicum }
        wateringEveryDays: { type: integer, minimum: 1, example: 2 }
        waterAmountMl: { type: integer, example: 100 }
        light: { type: string, enum: [LOW, MEDIUM, HIGH] }
        notes: { type: string, example: Ne zalivaj listov }
        photo: { type: string, format: binary }
paths:
  /api/auth/register:
    post:
      tags: [Avtentikacija]
      summary: Registracija novega uporabnika
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, location]
              properties:
                name: { type: string, example: Ana Novak }
                email: { type: string, example: ana@zalivaj.test }
                password: { type: string, example: test123 }
                location: { type: string, example: "Rožna dolina, blok 5" }
      responses:
        "201": { description: Račun je ustvarjen, vrne žeton in uporabnika }
        "400": { description: Manjkajoča ali neveljavna polja }
        "409": { description: Ta e-pošta je že v uporabi }
  /api/auth/login:
    post:
      tags: [Avtentikacija]
      summary: Prijava
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, example: ana@zalivaj.test }
                password: { type: string, example: test123 }
      responses:
        "200": { description: Vrne žeton JWT in uporabnika }
        "401": { description: Napačna e-pošta ali geslo }
        "403": { description: Vaš račun je blokiran }
  /api/auth/me:
    get:
      tags: [Avtentikacija]
      summary: Podatki prijavljenega uporabnika
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Prijavljeni uporabnik }
        "401": { description: Niste prijavljeni }
  /api/plants:
    get:
      tags: [Rastline]
      summary: Seznam rastlin prijavljenega lastnika
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Seznam rastlin }
    post:
      tags: [Rastline]
      summary: Dodajanje rastline
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PlantForm"
      responses:
        "201": { description: Rastlina je dodana }
        "400": { description: Manjkajoča ali neveljavna polja }
  /api/plants/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Rastline]
      summary: Podrobnosti lastne rastline
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Rastlina }
        "403": { description: Rastlina pripada drugemu uporabniku }
        "404": { description: Rastlina ne obstaja }
    put:
      tags: [Rastline]
      summary: Urejanje lastne rastline
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PlantForm"
      responses:
        "200": { description: Rastlina je posodobljena }
        "403": { description: Rastlina pripada drugemu uporabniku }
    delete:
      tags: [Rastline]
      summary: Brisanje lastne rastline
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Rastlina je izbrisana }
        "403": { description: Rastlina pripada drugemu uporabniku }
  /api/requests:
    post:
      tags: [Prošnje za varstvo]
      summary: Ustvarjanje prošnje za varstvo
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [startDate, endDate, location, plantIds]
              properties:
                startDate: { type: string, format: date, example: "2026-11-01" }
                endDate: { type: string, format: date, example: "2026-11-10" }
                location: { type: string, example: "Rožna dolina, blok 5" }
                note: { type: string, example: Ključ je na recepciji }
                plantIds: { type: array, items: { type: string, format: uuid } }
      responses:
        "201": { description: Prošnja je ustvarjena s statusom OPEN }
        "400": { description: Neveljavni datumi, manjkajoča polja ali tuje rastline }
  /api/requests/mine:
    get:
      tags: [Prošnje za varstvo]
      summary: Prošnje prijavljenega lastnika
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Seznam lastnikovih prošenj }
  /api/requests/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Prošnje za varstvo]
      summary: Podrobnosti prošnje (lastnik, sprejeti varuh ali odprta prošnja)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Prošnja }
        "403": { description: Ni pravic }
        "404": { description: Prošnja ne obstaja }
